name: Whitespace
description: >-
  Whitespace is an AI operating system for wholesale distributors, based in
  London and part of Y Combinator's Summer 2026 batch. The platform connects to
  a distributor's existing business systems (ERPs such as SAP, NetSuite, Epicor,
  Infor, Microsoft Dynamics and Sage, plus Salesforce, HubSpot, QuickBooks,
  Gmail and Outlook) to build a model of operations, then deploys self-improving
  AI agents that automate demand forecasting, inventory replenishment, order
  entry, quote generation, customer query responses, and accounts payable and
  receivable. It targets sectors including industrial supplies, electrical,
  plumbing, HVAC, building materials, foodservice, consumer goods and textiles.
  Founded by Alex Tung and Leon Yao. As an early-stage company it currently
  ships a product but publishes no public API, developer documentation or SDK.
